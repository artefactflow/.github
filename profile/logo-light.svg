<svg xmlns="http://www.w3.org/2000/svg" width="372" height="81" viewBox="0 0 372 81" role="img" aria-label="ArtefactFlow">
  <!-- Coloured artwork on transparent, for white and light backgrounds
       (README, slides, documents). Mark colours match favicon.svg. -->
  <g transform="translate(6,14) scale(1.9)">
    <!-- Brand mark -->
    <g transform="translate(0,0)">
      <rect x="2" y="14" width="9" height="9" rx="1.5" fill="#1976d2"/>
      <rect x="8.5" y="8" width="9" height="9" rx="1.5" fill="#2196f3"/>
      <rect x="15" y="2" width="9" height="9" rx="1.5" fill="#28a745"/>
    </g>
    <!-- Wordmark -->
    <text x="34" y="21" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="500" letter-spacing="0.3" fill="#0f1b2d">ArtefactFlow</text>
    <!-- Flow line -->
    <path d="M35 29 Q 63 25.5, 91 29 T 147 29" fill="none" stroke="#28a745" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
